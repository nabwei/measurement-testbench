name: Uncertainty and timing extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-extensions.txt
      - run: python -m pytest tests -q
        working-directory: 05_MEASUREMENT_TIMING
